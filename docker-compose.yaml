version: "3.9"

# Self-hosted Qdrant setup. One command builds the app image and starts
# everything:
#
#   docker compose up --build
#
# For Qdrant Cloud instead of self-hosting, skip the qdrant service below
# entirely and just point the app at your cluster:
#   QDRANT_URL=https://xxxx.aws.cloud.qdrant.io:6333
#   QDRANT_API_KEY=<your cluster's key>
# (same app image, same code — only these two env vars change)

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      # QDRANT_API_KEY left unset — self-hosted Qdrant has no auth by default
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-5-mini}
      EMBED_MODEL: ${EMBED_MODEL:-openai/text-embedding-3-small}
      EMBED_MIN_SCORE: ${EMBED_MIN_SCORE:-0.30}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      HYBRID_ALPHA: ${HYBRID_ALPHA:-0.6}
      TOP_K: ${TOP_K:-5}
      MAX_CONTEXT_TOKENS: ${MAX_CONTEXT_TOKENS:-3000}
      SECRET_KEY: ${SECRET_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 5000
      # Required inside a container: binding to 127.0.0.1 (the code's
      # own default, safe for bare-metal runs) would make the port
      # mapping below silently unreachable — see app.py's comment on
      # this exact variable.
      HOST: 0.0.0.0
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  qdrant_data: