# Self-hosted Qdrant & Ask My Docs RAG Server
# Usage:
#   docker compose up --build
#
# To point at Qdrant Cloud INSTEAD of self-hosting, set these in your .env:
#   QDRANT_URL=https://xxxx.aws.cloud.qdrant.io:6333
#   QDRANT_API_KEY=<your cluster key>

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ask_my_docs_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: ask_my_docs_app
    ports:
      - "5000:5000"
    environment:
      VECTOR_BACKEND: ${VECTOR_BACKEND:-qdrant}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      # Embeddings backend — "ollama" (default, no key) or "gemini"
      EMBED_BACKEND: ${EMBED_BACKEND:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-gemini-embedding-001}
      # Vision OCR backend — "ollama" (default) or "gemini"
      VISION_BACKEND: ${VISION_BACKEND:-ollama}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-3.7-flash}
      # Chat/generation backend — "ollama" (default) or "xai"
      CHAT_BACKEND: ${CHAT_BACKEND:-ollama}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_URL: ${XAI_URL:-https://api.x.ai/v1}
      XAI_MODEL: ${XAI_MODEL:-grok-4.3}
      EMBED_MIN_SCORE: ${EMBED_MIN_SCORE:-0.55}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      HYBRID_ALPHA: ${HYBRID_ALPHA:-0.6}
      RRF_K: ${RRF_K:-10}
      BM25_K1: ${BM25_K1:-1.5}
      BM25_B: ${BM25_B:-0.75}
      TOP_K: ${TOP_K:-8}
      MAX_CONTEXT_TOKENS: ${MAX_CONTEXT_TOKENS:-6000}
      DEFAULT_CHUNK_MODE: ${DEFAULT_CHUNK_MODE:-structured}
      DEFAULT_CHUNK_SIZE: ${DEFAULT_CHUNK_SIZE:-512}
      QDRANT_SCROLL_LIMIT: ${QDRANT_SCROLL_LIMIT:-5000}
      EVAL_CHUNK_MODE: ${EVAL_CHUNK_MODE:-structured}
      EMBED_BATCH: ${EMBED_BATCH:-32}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      RERANK_TOP_N: ${RERANK_TOP_N:-8}
      RERANK_MIN_RELEVANCE: ${RERANK_MIN_RELEVANCE:-5}
      QUERY_REWRITE_ENABLED: ${QUERY_REWRITE_ENABLED:-false}
      TRACE_LOG_PATH: ${TRACE_LOG_PATH:-traces/traces.jsonl}
      SECRET_KEY: ${SECRET_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 5000
      HOST: 0.0.0.0
    # host.docker.internal (the OLLAMA_URL default above) resolves
    # automatically on Docker Desktop (Mac/Windows) but NOT on native
    # Linux Docker without this mapping — needed so the app container can
    # reach an Ollama server running on the host machine at all.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/healthz\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./uploads:/app/uploads
      - ./vectorstore:/app/vectorstore
      - ./traces:/app/traces

volumes:
  qdrant_data: