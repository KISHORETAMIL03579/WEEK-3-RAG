version: "3.9"

# Self-hosted Qdrant by default — one command builds the app image and
# starts everything:
#
#   docker compose up --build
#
# To point at Qdrant Cloud INSTEAD of self-hosting, set these in your
# .env (same file docker-compose already reads for OPENROUTER_API_KEY,
# etc. — no need to edit this file):
#   QDRANT_URL=https://xxxx.aws.cloud.qdrant.io:6333
#   QDRANT_API_KEY=<your cluster's key>
# The local `qdrant` service below will still start (harmless, just
# unused) unless you also comment it out and remove the app service's
# `depends_on` — or skip docker-compose entirely and run
# `docker build && docker run --env-file .env ...` instead, which never
# starts a local Qdrant container at all.

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      VECTOR_BACKEND: qdrant
      # These two now actually respect .env, like every other var here —
      # previously QDRANT_URL was hardcoded to the local service and
      # QDRANT_API_KEY wasn't passed through at all, so setting your real
      # Qdrant Cloud credentials in .env was silently ignored.
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-5-mini}
      EMBED_MODEL: ${EMBED_MODEL:-openai/text-embedding-3-small}
      EMBED_MIN_SCORE: ${EMBED_MIN_SCORE:-0.55}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      HYBRID_ALPHA: ${HYBRID_ALPHA:-0.6}
      RRF_K: ${RRF_K:-10}
      BM25_K1: ${BM25_K1:-1.5}
      BM25_B: ${BM25_B:-0.75}
      TOP_K: ${TOP_K:-8}
      MAX_CONTEXT_TOKENS: ${MAX_CONTEXT_TOKENS:-6000}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      RERANK_TOP_N: ${RERANK_TOP_N:-8}
      RERANK_MIN_RELEVANCE: ${RERANK_MIN_RELEVANCE:-5}
      QUERY_REWRITE_ENABLED: ${QUERY_REWRITE_ENABLED:-false}
      SECRET_KEY: ${SECRET_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 5000
      # Required inside a container: binding to 127.0.0.1 (the code's
      # own default, safe for bare-metal runs) would make the port
      # mapping below silently unreachable — see app.py's comment on
      # this exact variable.
      HOST: 0.0.0.0
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  qdrant_data: