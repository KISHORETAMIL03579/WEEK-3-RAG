<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Open document — Ask My Docs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/svg+xml" href="/static/rag.svg?v=3"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=3"/>
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png?v=3"/>
  <link rel="shortcut icon" href="/static/favicon.ico?v=3"/>
  <link rel="apple-touch-icon" href="/static/favicon-32x32.png?v=3"/>
  <link rel="stylesheet" href="/static/css/app.css"/>

  <!-- React 18 & Dependencies CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- doc_id/filename/ext come from serve_file() in app.py via render_template().
       view.js reads window.DOC_ID as its fallback when the URL has no
       ?doc_id= query param — which it never does, since the Flask route
       is /file/<doc_id> (a path segment), not a query string. Without
       this block, view.js always saw an empty doc_id and showed
       "No document ID specified." regardless of which document was opened. -->
  <script>
    window.DOC_ID = {{ doc_id | tojson }};
    window.DOC_FILENAME = {{ filename | tojson }};
    window.DOC_EXT = {{ ext | tojson }};
  </script>

  <!-- React 18 Document Viewer Application Bundle -->
  <script type="text/babel" src="/static/js/view.js"></script>
</body>
</html>
